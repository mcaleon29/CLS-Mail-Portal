<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CLS Mail Portal</title>
<script src="https://accounts.google.com/gsi/client" async defer></script>

<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:Segoe UI,Arial,sans-serif;background:#f5f7fb;color:#202124;height:100vh;overflow:hidden}
button,input,textarea{font:inherit}button{cursor:pointer;border:0}
header{height:60px;background:#17365d;color:#fff;display:flex;align-items:center;gap:16px;padding:0 18px}
.logo{font-size:21px;font-weight:700;white-space:nowrap}.logo span{font-weight:400;color:#bfe7ff}
.search{flex:1;max-width:650px;position:relative}.search input{width:100%;height:38px;border:0;border-radius:6px;padding:0 42px 0 15px;outline:0}
.search button{position:absolute;right:4px;top:4px;height:30px;width:34px;background:transparent}
.user{margin-left:auto;white-space:nowrap;font-size:13px}
.layout{height:calc(100vh - 60px);display:grid;grid-template-columns:220px 390px minmax(0,1fr)}
.sidebar{background:#fff;border-right:1px solid #dfe3e8;padding:14px 10px;overflow:auto}
.new{width:100%;background:#2563eb;color:#fff;padding:12px;border-radius:7px;font-weight:700;margin-bottom:14px}
.nav{display:flex;align-items:center;gap:10px;width:100%;padding:10px 12px;background:transparent;border-radius:6px;text-align:left;color:#374151}
.nav:hover,.nav.active{background:#e8f1ff;color:#17365d;font-weight:600}.nav b{margin-left:auto;font-size:12px;color:#6b7280}
.connect{margin-top:20px;padding:12px;border:1px solid #dbe2ea;border-radius:8px;background:#f8fafc;font-size:12px;color:#6b7280}
.gmail-btn{width:100%;margin-top:9px;padding:9px;border-radius:6px;background:#ea4335;color:#fff;font-weight:600}
.list{background:#fff;border-right:1px solid #dfe3e8;display:flex;flex-direction:column;min-width:0}
.listhead{height:58px;border-bottom:1px solid #e3e7eb;display:flex;align-items:center;padding:0 15px}
.listhead h2{font-size:18px}.refresh{margin-left:auto;background:transparent;padding:7px;font-size:19px}
.messages{overflow:auto;flex:1}.mail{padding:12px 14px;border-bottom:1px solid #edf0f3;cursor:pointer}
.mail:hover{background:#f6f9fc}.mail.selected{background:#eaf2ff;border-left:3px solid #2563eb;padding-left:11px}
.mail.unread .from,.mail.unread .subject{font-weight:700}.row{display:flex;gap:7px}.from{font-size:14px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.date{margin-left:auto;font-size:11px;color:#6b7280;white-space:nowrap}
.subject{font-size:13px;margin-top:5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.snippet{font-size:12px;color:#6b7280;margin-top:4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.empty{padding:35px 20px;text-align:center;color:#6b7280}
.preview{background:#f8fafc;display:flex;flex-direction:column;min-width:0}.previewhead{background:#fff;border-bottom:1px solid #e3e7eb;padding:18px 24px}
.previewhead h1{font-size:20px;line-height:1.3;margin-bottom:13px;word-break:break-word}.meta{font-size:13px;color:#4b5563}.meta strong{color:#202124}
.actions{padding:9px 24px;background:#fff;border-bottom:1px solid #e3e7eb}.actions button{background:#fff;padding:7px 11px;border-radius:5px;margin-right:5px}.actions button:hover{background:#eef2f7}
.body{padding:24px;overflow:auto;white-space:pre-wrap;line-height:1.55;font-size:14px;flex:1;background:#fff;margin:14px;border:1px solid #e1e5ea;border-radius:8px}
footer{display:none}
.compose-section{position:fixed;right:30px;bottom:25px;width:min(650px,calc(100% - 40px));background:#fff;border-radius:9px;box-shadow:0 12px 45px #0004;padding:18px;z-index:10;display:none}
.compose-section.show{display:block}.compose-section h2{background:#17365d;color:#fff;margin:-18px -18px 15px;padding:13px 17px;font-size:16px}
.form-group{margin:9px 0}.form-group label{display:block;font-size:12px;color:#6b7280;margin-bottom:4px}
.form-group input,.form-group textarea{width:100%;border:1px solid #d1d5db;border-radius:5px;padding:9px;outline:0}.form-group textarea{min-height:180px;resize:vertical}
.send-btn{background:#2563eb;color:#fff;padding:10px 17px;border-radius:6px;font-weight:700}.send-btn:disabled{background:#9ca3af}.compose-status{margin-left:10px;font-size:13px}
@media(max-width:900px){.layout{grid-template-columns:190px 330px minmax(350px,1fr)}}
@media(max-width:700px){body{overflow:auto}.layout{height:auto;min-width:0;grid-template-columns:1fr}.sidebar{display:none}.list{height:45vh}.preview{min-height:50vh}.user{display:none}}
</style>

</head>
<body>

<header>
  <div class="logo">CLS <span>Mail Portal</span></div>
  <div class="search"><input id="searchBox" placeholder="Search mail"><button onclick="alert('Search is ready for the next Gmail message-list upgrade.')">🔍</button></div>
  <div class="user" id="userStatus">● Not Connected</div>
</header>

<div class="layout">
  <aside class="sidebar">
    <button class="new" onclick="document.getElementById('compose-section').classList.add('show')">✉ New Email</button>
    <button class="nav active">📥 Inbox <b id="inboxCount">0</b></button>
    <button class="nav">📤 Sent <b id="sentCount">0</b></button>
    <button class="nav">⭐ Important <b id="importantCount">0</b></button>
    <button class="nav">🔔 Unread <b id="unreadCount">0</b></button>
    <button class="nav">🗑️ Trash</button>
    <div class="connect">
      <div id="status">Gmail is not connected yet.</div>
      <button class="gmail-btn" id="gmailButton">Connect Gmail</button>
    </div>
  </aside>

  <section class="list">
    <div class="listhead"><h2>Inbox</h2><button class="refresh" onclick="location.reload()">↻</button></div>
    <div class="messages" id="mailList"><div class="empty">Connect Gmail to load your messages.</div></div>
  </section>

  <section class="preview">
    <div class="previewhead">
      <h1 id="previewSubject">Select an email</h1>
      <div class="meta"><strong id="previewSender">No message selected</strong><br><span id="previewTo"></span></div>
    </div>
    <div class="actions">
      <button onclick="alert('Reply will be connected to the selected Gmail message next.')">↩ Reply</button>
      <button onclick="alert('Forward will be connected to the selected Gmail message next.')">↪ Forward</button>
      <button onclick="alert('Save/download will be connected to Gmail messages and attachments next.')">⬇ Save</button>
    </div>
    <div class="body" id="messageBody">Your selected email will appear here.</div>
  </section>
</div>

<div class="compose-section" id="compose-section">
  <h2>📧 New Email <button style="float:right;background:transparent;color:white;font-size:20px" onclick="document.getElementById('compose-section').classList.remove('show')">×</button></h2>
  <div class="form-group"><label>To</label><input type="email" id="toEmail" placeholder="recipient@example.com"></div>
  <div class="form-group"><label>Subject</label><input type="text" id="subject" placeholder="Subject"></div>
  <div class="form-group"><label>Message</label><textarea id="message" placeholder="Write your message here..."></textarea></div>
  <button class="send-btn" id="sendButton" onclick="sendEmail()">📤 Send Email</button>
  <span class="compose-status" id="composeStatus"></span>
</div>

<script>

const CLIENT_ID = "1038665915515-3nsa9hobqcnllc1ja4kahl87v2lqmdpj.apps.googleusercontent.com";

let gmailAccessToken = null;


/* =========================
   UPDATE CONNECTION STATUS
========================= */

function updateStatus(message) {

  document
    .getElementById("status")
    .textContent = message;

}


/* =========================
   COMPOSE STATUS
========================= */

function updateComposeStatus(message, type = "info") {

  const status =
    document.getElementById("composeStatus");

  status.style.display = "block";

  status.textContent = message;

  if (type === "success") {

    status.style.background = "#dcfce7";
    status.style.color = "#166534";

  }

  else if (type === "error") {

    status.style.background = "#fee2e2";
    status.style.color = "#991b1b";

  }

  else {

    status.style.background = "#dbeafe";
    status.style.color = "#1e40af";

  }

}


/* =========================
   GET GMAIL COUNT
========================= */

async function getGmailCount(query) {

  const response = await fetch(

    "https://gmail.googleapis.com/gmail/v1/users/me/messages?q=" +
    encodeURIComponent(query),

    {

      headers: {

        Authorization:
          "Bearer " + gmailAccessToken

      }

    }

  );


  const data =
    await response.json();


  if (!response.ok) {

    throw new Error(

      data.error?.message ||
      "Unable to load Gmail messages."

    );

  }


  return data.resultSizeEstimate || 0;

}


/* =========================
   LOAD GMAIL COUNTS
========================= */

async function loadGmailCounts() {

  try {

    updateStatus(
      "📥 Loading Gmail messages..."
    );


    const inbox =
      await getGmailCount("in:inbox");

    document
      .getElementById("inboxCount")
      .textContent = inbox;


    const sent =
      await getGmailCount("in:sent");

    document
      .getElementById("sentCount")
      .textContent = sent;


    const important =
      await getGmailCount("is:important");

    document
      .getElementById("importantCount")
      .textContent = important;


    const unread =
      await getGmailCount("is:unread");

    document
      .getElementById("unreadCount")
      .textContent = unread;


    updateStatus(
      "✅ Gmail connected successfully! Messages loaded."
    );


  }

  catch (error) {

    updateStatus(

      "❌ Unable to load Gmail messages: " +
      error.message

    );

  }

}


/* =========================
   CONNECT GMAIL
========================= */

function connectGmail() {

  updateStatus(
    "Connecting to Gmail..."
  );


  if (

    typeof google === "undefined" ||

    !google.accounts ||

    !google.accounts.oauth2

  ) {

    updateStatus(

      "❌ Google authentication is still loading. Please wait a few seconds and try again."

    );

    return;

  }


  const client =

    google.accounts.oauth2.initTokenClient({

      client_id:
        CLIENT_ID,


      scope:

        "https://www.googleapis.com/auth/gmail.readonly " +

        "https://www.googleapis.com/auth/gmail.send",


      callback:

        async (response) => {


          if (response.error) {

            updateStatus(

              "❌ Gmail connection failed: " +
              response.error

            );

            return;

          }


          gmailAccessToken =
            response.access_token;


          document
            .getElementById("userStatus")
            .textContent =
            "Gmail Connected";


          updateStatus(

            "✅ Gmail connected successfully! Loading messages..."

          );


          await loadGmailCounts();

        },


      error_callback:
        (error) => {


          updateStatus(

            "❌ Connection error: " +

            (error.type ||
            "Unknown error")

          );

        }

    });


  client.requestAccessToken({

    prompt:
      "consent"

  });

}


/* =========================
   BASE64 URL ENCODE
========================= */

function base64UrlEncode(str) {

  const bytes =
    new TextEncoder()
      .encode(str);

  let binary = "";

  bytes.forEach(

    (byte) => {

      binary +=
        String.fromCharCode(byte);

    }

  );


  return btoa(binary)

    .replace(/\+/g, "-")

    .replace(/\//g, "_")

    .replace(/=+$/, "");

}


/* =========================
   SEND EMAIL
========================= */

async function sendEmail() {


  if (!gmailAccessToken) {

    updateComposeStatus(

      "❌ Please connect your Gmail account first.",

      "error"

    );

    return;

  }


  const to =
    document
      .getElementById("toEmail")
      .value
      .trim();


  const subject =
    document
      .getElementById("subject")
      .value
      .trim();


  const message =
    document
      .getElementById("message")
      .value
      .trim();


  if (!to) {

    updateComposeStatus(

      "❌ Please enter the recipient email address.",

      "error"

    );

    return;

  }


  if (!subject) {

    updateComposeStatus(

      "❌ Please enter the email subject.",

      "error"

    );

    return;

  }


  if (!message) {

    updateComposeStatus(

      "❌ Please enter your message.",

      "error"

    );

    return;

  }


  const sendButton =
    document
      .getElementById("sendButton");


  sendButton.disabled =
    true;


  sendButton.textContent =
    "Sending...";


  updateComposeStatus(

    "📤 Sending email...",

    "info"

  );


  try {


    const emailContent =

      "To: " + to + "\r\n" +

      "Subject: " + subject + "\r\n" +

      "MIME-Version: 1.0\r\n" +

      "Content-Type: text/plain; charset=UTF-8\r\n" +

      "Content-Transfer-Encoding: 8bit\r\n" +

      "\r\n" +

      message;


    const rawEmail =
      base64UrlEncode(
        emailContent
      );


    const response =
      await fetch(

        "https://gmail.googleapis.com/gmail/v1/users/me/messages/send",

        {

          method:
            "POST",


          headers:

            {

              Authorization:

                "Bearer " +
                gmailAccessToken,


              "Content-Type":
                "application/json"

            },


          body:

            JSON.stringify({

              raw:
                rawEmail

            })

        }

      );


    const data =
      await response.json();


    if (!response.ok) {

      throw new Error(

        data.error?.message ||

        "Unable to send email."

      );

    }


    updateComposeStatus(

      "✅ Email sent successfully!",

      "success"

    );


    document
      .getElementById("toEmail")
      .value = "";


    document
      .getElementById("subject")
      .value = "";


    document
      .getElementById("message")
      .value = "";


    const sent =
      await getGmailCount(
        "in:sent"
      );


    document
      .getElementById("sentCount")
      .textContent =
      sent;


  }

  catch (error) {


    updateComposeStatus(

      "❌ Failed to send email: " +

      error.message,

      "error"

    );

  }

  finally {


    sendButton.disabled =
      false;


    sendButton.innerHTML =
      "📤 Send Email";

  }

}


/* =========================
   CONNECT BUTTON
========================= */

document
  .getElementById("gmailButton")
  .addEventListener(

    "click",

    connectGmail

  );

</script>
</body>
</html>
