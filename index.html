<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CLS Mail Portal</title>
<script src="https://accounts.google.com/gsi/client" async defer></script>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:Segoe UI,Arial,sans-serif;background:#f5f7fb;color:#202124;height:100vh;overflow:hidden}
button,input,textarea{font:inherit}button{cursor:pointer;border:0}
.topbar{height:60px;background:#17365d;color:white;display:flex;align-items:center;gap:16px;padding:0 18px}
.logo{font-size:21px;font-weight:700;white-space:nowrap}.logo span{font-weight:400;color:#bfe7ff}
.search{flex:1;max-width:650px;position:relative}.search input{width:100%;height:38px;border:0;border-radius:6px;padding:0 42px 0 15px;outline:0}
.search button{position:absolute;right:3px;top:3px;height:32px;width:38px;background:transparent}
.user{margin-left:auto;font-size:13px;white-space:nowrap}
.dot{display:inline-block;width:8px;height:8px;border-radius:50%;background:#ef4444;margin-right:6px}.dot.ok{background:#22c55e}
.layout{height:calc(100vh - 60px);display:grid;grid-template-columns:220px 400px minmax(0,1fr)}
.sidebar{background:white;border-right:1px solid #dfe3e8;padding:14px 10px;overflow:auto}
.new-btn{width:100%;background:#2563eb;color:white;padding:12px;border-radius:7px;font-weight:700;margin-bottom:14px}
.new-btn:hover{background:#1d4ed8}
.nav{display:flex;align-items:center;gap:10px;width:100%;padding:10px 12px;background:transparent;border-radius:6px;text-align:left;color:#374151;margin:2px 0}
.nav:hover,.nav.active{background:#e8f1ff;color:#17365d;font-weight:600}.nav .num{margin-left:auto;font-size:12px;color:#6b7280}
.connect{margin-top:20px;padding:12px;border:1px solid #dbe2ea;border-radius:8px;background:#f8fafc;font-size:12px;color:#6b7280}
.gmail-btn{width:100%;margin-top:9px;padding:9px;border-radius:6px;background:#ea4335;color:white;font-weight:600}
.listpane{background:white;border-right:1px solid #dfe3e8;display:flex;flex-direction:column;min-width:0}
.listhead{height:58px;border-bottom:1px solid #e3e7eb;display:flex;align-items:center;padding:0 15px;gap:10px}
.listhead h2{font-size:18px}.refresh{margin-left:auto;background:transparent;padding:7px;font-size:20px;color:#4b5563}
.messages{overflow:auto;flex:1}
.mail{padding:12px 14px;border-bottom:1px solid #edf0f3;cursor:pointer}
.mail:hover{background:#f6f9fc}.mail.selected{background:#eaf2ff;border-left:3px solid #2563eb;padding-left:11px}
.mail.unread .from,.mail.unread .subject{font-weight:700}
.row{display:flex;gap:7px;align-items:center}.from{font-size:14px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.date{margin-left:auto;font-size:11px;color:#6b7280;white-space:nowrap}
.subject{font-size:13px;margin-top:5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.snippet{font-size:12px;color:#6b7280;margin-top:4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.star{color:#b9bec7}.important{color:#f59e0b}
.empty{padding:35px 20px;text-align:center;color:#6b7280;line-height:1.5}
.preview{background:#f8fafc;display:flex;flex-direction:column;min-width:0}
.previewhead{background:white;border-bottom:1px solid #e3e7eb;padding:18px 24px}
.previewhead h1{font-size:20px;line-height:1.3;margin-bottom:12px;word-break:break-word}
.meta{font-size:13px;color:#4b5563;line-height:1.45}.meta strong{color:#202124}
.actions{padding:9px 24px;background:white;border-bottom:1px solid #e3e7eb}
.actions button{background:white;padding:7px 11px;border-radius:5px;margin-right:5px;color:#374151}
.actions button:hover{background:#eef2f7}
.body{padding:24px;overflow:auto;white-space:pre-wrap;line-height:1.55;font-size:14px;flex:1;background:white;margin:14px;border:1px solid #e1e5ea;border-radius:8px}
.attachments{padding:0 24px 14px;background:white}.attachment{display:inline-block;background:#eef4ff;border:1px solid #cddcf7;padding:7px 10px;border-radius:5px;margin:4px 5px 0 0;font-size:12px}
.compose-modal{display:none;position:fixed;inset:0;background:#0006;z-index:50;align-items:center;justify-content:center;padding:20px}
.compose-modal.show{display:flex}.compose{width:min(700px,100%);background:white;border-radius:9px;box-shadow:0 15px 50px #0005;overflow:hidden}
.compose-head{background:#17365d;color:white;padding:13px 17px;display:flex;justify-content:space-between;align-items:center}
.close{background:transparent;color:white;font-size:22px}.compose-body{padding:16px}
.field{display:flex;border-bottom:1px solid #e2e5e9;padding:10px 0}.field label{width:70px;color:#6b7280}.field input{border:0;outline:0;flex:1}
.compose-body textarea{width:100%;min-height:230px;border:0;outline:0;padding:14px 0;resize:vertical}
.compose-foot{padding:12px 17px;border-top:1px solid #e2e5e9;display:flex;align-items:center;gap:10px}
.send-btn{background:#2563eb;color:white;padding:10px 18px;border-radius:6px;font-weight:700}.send-btn:disabled{background:#9ca3af}
.compose-status{font-size:13px;color:#2563eb}
@media(max-width:900px){.layout{grid-template-columns:190px 330px minmax(350px,1fr)}}
@media(max-width:700px){body{overflow:auto}.layout{height:auto;min-width:0;grid-template-columns:1fr}.sidebar{display:none}.listpane{height:45vh}.preview{min-height:55vh}.user{display:none}}
</style>
</head>
<body>

<header class="topbar">
  <div class="logo">CLS <span>Mail Portal</span></div>
  <div class="search">
    <input id="searchBox" type="text" placeholder="Search mail">
    <button onclick="renderMailList()" title="Search">🔍</button>
  </div>
  <div class="user"><span id="connectionDot" class="dot"></span><span id="userStatus">Not Connected</span></div>
</header>

<div class="layout">
  <aside class="sidebar">
    <button class="new-btn" onclick="openCompose()">✉ New Email</button>
    <button class="nav active" onclick="selectFolder('inbox',this)">📥 Inbox <span class="num" id="inboxCount">0</span></button>
    <button class="nav" onclick="selectFolder('sent',this)">📤 Sent <span class="num" id="sentCount">0</span></button>
    <button class="nav" onclick="selectFolder('important',this)">⭐ Important <span class="num" id="importantCount">0</span></button>
    <button class="nav" onclick="selectFolder('unread',this)">🔔 Unread <span class="num" id="unreadCount">0</span></button>
    <button class="nav" onclick="selectFolder('trash',this)">🗑️ Trash</button>
    <div class="connect">
      <div id="status">Gmail is not connected yet.</div>
      <button class="gmail-btn" id="gmailButton">Connect Gmail</button>
    </div>
  </aside>

  <section class="listpane">
    <div class="listhead"><h2 id="folderTitle">Inbox</h2><button class="refresh" onclick="loadCurrentFolder()" title="Refresh">↻</button></div>
    <div class="messages" id="mailList"><div class="empty">Connect Gmail to load your messages.</div></div>
  </section>

  <section class="preview">
    <div class="previewhead">
      <h1 id="previewSubject">Select an email</h1>
      <div class="meta"><strong id="previewSender">No message selected</strong><br><span id="previewTo"></span><br><span id="previewDate"></span></div>
    </div>
    <div class="actions">
      <button onclick="replyCurrent()">↩ Reply</button>
      <button onclick="forwardCurrent()">↪ Forward</button>
      <button onclick="downloadCurrent()">⬇ Save</button>
    </div>
    <div class="body" id="messageBody">Your selected email will appear here.</div>
    <div class="attachments" id="attachments"></div>
  </section>
</div>

<div class="compose-modal" id="composeModal">
  <div class="compose">
    <div class="compose-head"><strong>New Email</strong><button class="close" onclick="closeCompose()">×</button></div>
    <div class="compose-body">
      <div class="field"><label>To</label><input id="toEmail" type="email" placeholder="recipient@example.com"></div>
      <div class="field"><label>Subject</label><input id="subject" type="text" placeholder="Subject"></div>
      <textarea id="message" placeholder="Write your message here..."></textarea>
    </div>
    <div class="compose-foot">
      <button class="send-btn" id="sendButton" onclick="sendEmail()">📤 Send Email</button>
      <span class="compose-status" id="composeStatus"></span>
    </div>
  </div>
</div>

<script>
const CLIENT_ID = "1038665915515-3nsa9hobqcnllc1ja4kahl87v2lqmdpj.apps.googleusercontent.com";
const SCOPES = "https://www.googleapis.com/auth/gmail.readonly https://www.googleapis.com/auth/gmail.send";
let gmailAccessToken = null;
let currentFolder = "inbox";
let currentMessages = [];
let currentMessage = null;

const $ = id => document.getElementById(id);

function updateStatus(msg) { $("status").textContent = msg; }
function setConnected(ok) {
  $("connectionDot").className = "dot" + (ok ? " ok" : "");
  $("userStatus").textContent = ok ? "Gmail Connected" : "Not Connected";
}

async function gmailFetch(url, options={}) {
  const headers = Object.assign({}, options.headers || {});
  headers.Authorization = "Bearer " + gmailAccessToken;
  if (options.body) headers["Content-Type"] = "application/json";
  const response = await fetch(url, Object.assign({}, options, {headers}));
  const data = await response.json().catch(() => ({}));
  if (!response.ok) throw new Error(data.error?.message || "Gmail request failed");
  return data;
}

function headerValue(headers, name) {
  const h = (headers || []).find(x => x.name.toLowerCase() === name.toLowerCase());
  return h ? h.value : "";
}

function decodeBase64Url(data) {
  if (!data) return "";
  data = data.replace(/-/g, "+").replace(/_/g, "/");
  while (data.length % 4) data += "=";
  try {
    const bytes = Uint8Array.from(atob(data), c => c.charCodeAt(0));
    return new TextDecoder("utf-8").decode(bytes);
  } catch(e) { return ""; }
}

function extractPlainText(payload) {
  if (!payload) return "";
  if (payload.mimeType === "text/plain" && payload.body?.data) return decodeBase64Url(payload.body.data);
  if (payload.parts) {
    for (const p of payload.parts) {
      const result = extractPlainText(p);
      if (result) return result;
    }
  }
  return payload.body?.data ? decodeBase64Url(payload.body.data) : "";
}

function extractHtmlBody(payload) {
  if (!payload) return "";
  if (payload.mimeType === "text/html" && payload.body?.data) {
    return decodeBase64Url(payload.body.data);
  }
  if (payload.parts) {
    for (const p of payload.parts) {
      const result = extractHtmlBody(p);
      if (result) return result;
    }
  }
  return "";
}

function makeSafeEmailHtml(htmlText) {
  if (!htmlText) return "";
  const parser = new DOMParser();
  const doc = parser.parseFromString(htmlText, "text/html");

  doc.querySelectorAll("script,object,embed,applet,form,base,meta,link").forEach(x => x.remove());

  doc.querySelectorAll("*").forEach(el => {
    [...el.attributes].forEach(attr => {
      const n = attr.name.toLowerCase();
      const v = attr.value.trim().toLowerCase();
      if (n.startsWith("on") || n === "srcdoc" || n === "formaction") {
        el.removeAttribute(attr.name);
      }
      if ((n === "href" || n === "src") && v.startsWith("javascript:")) {
        el.removeAttribute(attr.name);
      }
    });
  });

  doc.querySelectorAll("a").forEach(a => {
    a.setAttribute("target","_blank");
    a.setAttribute("rel","noopener noreferrer");
  });

  const style = doc.createElement("style");
  style.textContent = `
    body { font-family: Segoe UI, Arial, sans-serif; color:#202124; background:#fff;
           margin:18px; line-height:1.5; overflow-wrap:anywhere; }
    img { max-width:100%; height:auto; }
    table { max-width:100%; }
  `;
  doc.head.appendChild(style);
  return "<!doctype html>" + doc.documentElement.outerHTML;
}

function getAttachments(payload, result=[]) {
  if (!payload) return result;
  if (payload.filename && payload.body?.attachmentId) {
    result.push({filename:payload.filename, mimeType:payload.mimeType, attachmentId:payload.body.attachmentId, size:payload.body.size || 0});
  }
  (payload.parts || []).forEach(p => getAttachments(p,result));
  return result;
}

function escapeHtml(s) {
  return String(s || "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[c]));
}

function shortDate(ms) {
  if (!ms) return "";
  const d = new Date(Number(ms)), now = new Date();
  if (d.toDateString() === now.toDateString()) return d.toLocaleTimeString([],{hour:"numeric",minute:"2-digit"});
  return d.toLocaleDateString([],{month:"short",day:"numeric"});
}

function queryForFolder(folder) {
  return {inbox:"in:inbox",sent:"in:sent",important:"is:important",unread:"is:unread",trash:"in:trash"}[folder] || "in:inbox";
}

async function getGmailCount(query) {
  const data = await gmailFetch("https://gmail.googleapis.com/gmail/v1/users/me/messages?q=" + encodeURIComponent(query));
  return data.resultSizeEstimate || 0;
}

async function loadGmailCounts() {
  const values = await Promise.all([
    getGmailCount("in:inbox"),
    getGmailCount("in:sent"),
    getGmailCount("is:important"),
    getGmailCount("is:unread")
  ]);
  $("inboxCount").textContent = values[0];
  $("sentCount").textContent = values[1];
  $("importantCount").textContent = values[2];
  $("unreadCount").textContent = values[3];
}

async function getMessage(id) {
  return await gmailFetch("https://gmail.googleapis.com/gmail/v1/users/me/messages/" + id + "?format=full");
}

async function loadCurrentFolder() {
  if (!gmailAccessToken) {
    $("mailList").innerHTML = '<div class="empty">Connect Gmail first.</div>';
    return;
  }
  $("mailList").innerHTML = '<div class="empty">📥 Loading messages...</div>';
  updateStatus("Loading " + $("folderTitle").textContent + "...");
  try {
    const data = await gmailFetch(
      "https://gmail.googleapis.com/gmail/v1/users/me/messages?maxResults=50&q=" +
      encodeURIComponent(queryForFolder(currentFolder))
    );
    const ids = data.messages || [];
    currentMessages = await Promise.all(ids.map(x => getMessage(x.id)));
    renderMailList();
    updateStatus("✅ Gmail connected successfully! Messages loaded.");
  } catch(e) {
    $("mailList").innerHTML = '<div class="empty">❌ ' + escapeHtml(e.message) + '</div>';
    updateStatus("❌ Unable to load messages: " + e.message);
  }
}

function renderMailList() {
  const term = $("searchBox").value.trim().toLowerCase();
  const items = currentMessages.filter(m => {
    const h = m.payload?.headers || [];
    const text = [headerValue(h,"From"),headerValue(h,"To"),headerValue(h,"Subject")].join(" ").toLowerCase();
    return !term || text.includes(term);
  });
  if (!items.length) {
    $("mailList").innerHTML = '<div class="empty">No emails found.</div>';
    return;
  }
  $("mailList").innerHTML = items.map(m => {
    const h=m.payload?.headers||[];
    const from=headerValue(h,"From")||"Unknown sender";
    const subject=headerValue(h,"Subject")||"(No subject)";
    const snippet=(m.snippet||extractPlainText(m.payload)||"").replace(/\s+/g," ").slice(0,110);
    const unread=m.labelIds?.includes("UNREAD");
    const important=m.labelIds?.includes("IMPORTANT");
    return `<div class="mail ${unread?"unread":""} ${currentMessage?.id===m.id?"selected":""}" onclick="openMessage('${m.id}')">
      <div class="row"><span class="${important?"important":"star"}">${important?"★":"☆"}</span><span class="from">${escapeHtml(from)}</span><span class="date">${shortDate(m.internalDate)}</span></div>
      <div class="subject">${escapeHtml(subject)}</div>
      <div class="snippet">${escapeHtml(snippet)}</div>
    </div>`;
  }).join("");
}

async function openMessage(id) {
  currentMessage = currentMessages.find(m => m.id === id);
  if (!currentMessage) return;
  const h=currentMessage.payload?.headers||[];
  $("previewSubject").textContent=headerValue(h,"Subject")||"(No subject)";
  $("previewSender").textContent=headerValue(h,"From")||"Unknown sender";
  $("previewTo").textContent=headerValue(h,"To") ? "To: "+headerValue(h,"To") : "";
  $("previewDate").textContent=headerValue(h,"Date");
  const htmlBody = extractHtmlBody(currentMessage.payload);
  const plainBody = extractPlainText(currentMessage.payload) || currentMessage.snippet || "(No readable message text.)";

  if (htmlBody) {
    $("messageBody").innerHTML = '<iframe id="emailFrame" title="Email content" sandbox="allow-same-origin" style="width:100%;height:100%;min-height:520px;border:0;background:white"></iframe>';
    const frame = $("emailFrame");
    frame.srcdoc = makeSafeEmailHtml(htmlBody);
  } else {
    $("messageBody").textContent = plainBody;
  }

  const atts=getAttachments(currentMessage.payload);
  $("attachments").innerHTML=atts.length
    ? "<strong>Attachments:</strong> " + atts.map((a,i)=>`<button class="attachment" onclick="downloadAttachment('${currentMessage.id}','${a.attachmentId}','${escapeHtml(a.filename).replace(/'/g,"&#039;")}')">📎 ${escapeHtml(a.filename)}</button>`).join("")
    : "";
  renderMailList();
}

function selectFolder(folder, el) {
  currentFolder=folder;
  document.querySelectorAll(".nav").forEach(x=>x.classList.remove("active"));
  el.classList.add("active");
  $("folderTitle").textContent={inbox:"Inbox",sent:"Sent",important:"Important",unread:"Unread",trash:"Trash"}[folder];
  currentMessage=null;
  $("previewSubject").textContent="Select an email";
  $("previewSender").textContent="No message selected";
  $("previewTo").textContent="";
  $("previewDate").textContent="";
  $("messageBody").textContent="Your selected email will appear here.";
  $("attachments").innerHTML="";
  loadCurrentFolder();
}

async function downloadAttachment(messageId, attachmentId, filename) {
  try {
    const data=await gmailFetch("https://gmail.googleapis.com/gmail/v1/users/me/messages/"+messageId+"/attachments/"+attachmentId);
    let raw=(data.data||"").replace(/-/g,"+").replace(/_/g,"/");
    while(raw.length%4) raw+="=";
    const bytes=Uint8Array.from(atob(raw),c=>c.charCodeAt(0));
    const blob=new Blob([bytes]);
    const a=document.createElement("a");
    a.href=URL.createObjectURL(blob); a.download=filename; a.click();
    setTimeout(()=>URL.revokeObjectURL(a.href),1000);
  } catch(e) { alert("Unable to download attachment: "+e.message); }
}

function downloadCurrent() {
  if (!currentMessage) { alert("Select an email first."); return; }
  const h=currentMessage.payload?.headers||[];
  const subject=(headerValue(h,"Subject")||"email").replace(/[\\/:*?"<>|]/g,"_");
  const content="From: "+headerValue(h,"From")+"\nTo: "+headerValue(h,"To")+"\nDate: "+headerValue(h,"Date")+"\nSubject: "+headerValue(h,"Subject")+"\n\n"+extractPlainText(currentMessage.payload);
  const blob=new Blob([content],{type:"text/plain;charset=utf-8"});
  const a=document.createElement("a");a.href=URL.createObjectURL(blob);a.download=subject+".txt";a.click();
  setTimeout(()=>URL.revokeObjectURL(a.href),1000);
}

function openCompose(to="",subject="",body="") {
  $("composeModal").classList.add("show");
  $("toEmail").value=to;$("subject").value=subject;$("message").value=body;$("composeStatus").textContent="";
  setTimeout(()=>$("toEmail").focus(),50);
}
function closeCompose() { $("composeModal").classList.remove("show"); }

function replyCurrent() {
  if (!currentMessage) { alert("Select an email first."); return; }
  const h=currentMessage.payload?.headers||[];
  const from=headerValue(h,"From");
  const email=(from.match(/<([^>]+)>/)||[])[1] || from;
  openCompose(email,"Re: "+(headerValue(h,"Subject")||""),"\n\n---------- Original message ----------\n"+extractPlainText(currentMessage.payload));
}

function forwardCurrent() {
  if (!currentMessage) { alert("Select an email first."); return; }
  const h=currentMessage.payload?.headers||[];
  openCompose("", "Fwd: "+(headerValue(h,"Subject")||""),"\n\n---------- Forwarded message ----------\n"+extractPlainText(currentMessage.payload));
}

function base64UrlEncode(str) {
  const bytes=new TextEncoder().encode(str); let binary="";
  bytes.forEach(b=>binary+=String.fromCharCode(b));
  return btoa(binary).replace(/\+/g,"-").replace(/\//g,"_").replace(/=+$/,"");
}

async function sendEmail() {
  if (!gmailAccessToken) { $("composeStatus").textContent="❌ Connect Gmail first."; return; }
  const to=$("toEmail").value.trim(), subject=$("subject").value.trim(), message=$("message").value;
  if (!to || !subject || !message.trim()) { $("composeStatus").textContent="❌ To, Subject and Message are required."; return; }
  const btn=$("sendButton");btn.disabled=true;btn.textContent="Sending...";
  $("composeStatus").textContent="Sending email...";
  try {
    const email="To: "+to+"\r\nSubject: "+subject+"\r\nMIME-Version: 1.0\r\nContent-Type: text/plain; charset=UTF-8\r\nContent-Transfer-Encoding: 8bit\r\n\r\n"+message;
    await gmailFetch("https://gmail.googleapis.com/gmail/v1/users/me/messages/send",{method:"POST",body:JSON.stringify({raw:base64UrlEncode(email)})});
    $("composeStatus").textContent="✅ Email sent successfully!";
    await loadGmailCounts();
    setTimeout(closeCompose,800);
  } catch(e) {
    $("composeStatus").textContent="❌ Failed to send: "+e.message;
  } finally {
    btn.disabled=false;btn.textContent="📤 Send Email";
  }
}

function connectGmail() {
  updateStatus("Connecting to Gmail...");
  if (typeof google==="undefined" || !google.accounts?.oauth2) {
    updateStatus("❌ Google authentication is still loading. Wait a few seconds.");
    return;
  }
  const client=google.accounts.oauth2.initTokenClient({
    client_id:CLIENT_ID,
    scope:SCOPES,
    callback:async response => {
      if(response.error){updateStatus("❌ Gmail connection failed: "+response.error);return;}
      gmailAccessToken=response.access_token;
      setConnected(true);
      await loadGmailCounts();
      await loadCurrentFolder();
    },
    error_callback:e=>updateStatus("❌ Connection error: "+(e.type||"Unknown error"))
  });
  client.requestAccessToken({prompt:"consent"});
}

$("gmailButton").addEventListener("click",connectGmail);
$("searchBox").addEventListener("input",renderMailList);
$("composeModal").addEventListener("click",e=>{if(e.target.id==="composeModal")closeCompose();});
</script>
</body>
</html>
