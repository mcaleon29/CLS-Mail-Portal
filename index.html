<script>
  const CLIENT_ID =
    "1038665915515-3nsa9hobqcnllc1ja4kahl87v2lqmdpj.apps.googleusercontent.com";

  let gmailAccessToken = null;

  function updateStatus(message) {
    document.getElementById("status").textContent = message;
  }

  async function getEmailCount(query) {

    const response = await fetch(
      "https://gmail.googleapis.com/gmail/v1/users/me/messages?q=" +
      encodeURIComponent(query),
      {
        headers: {
          Authorization: "Bearer " + gmailAccessToken
        }
      }
    );

    const data = await response.json();

    if (!response.ok) {
      throw new Error(
        data.error?.message || "Unable to load Gmail messages."
      );
    }

    return data.resultSizeEstimate || 0;
  }


  async function loadGmailCounts() {

    try {

      updateStatus("📥 Loading Gmail messages...");

      const inbox = await getEmailCount("in:inbox");
      document.getElementById("inboxCount").textContent = inbox;

      const sent = await getEmailCount("in:sent");
      document.getElementById("sentCount").textContent = sent;

      const important = await getEmailCount("is:important");
      document.getElementById("importantCount").textContent = important;

      const unread = await getEmailCount("is:unread");
      document.getElementById("unreadCount").textContent = unread;

      updateStatus("✅ Gmail connected and messages loaded successfully!");

    } catch (error) {

      console.error(error);

      updateStatus(
        "❌ Gmail is connected, but messages could not be loaded: " +
        error.message
      );
    }
  }


  function connectGmail() {

    updateStatus("Connecting to Gmail...");

    if (
      typeof google === "undefined" ||
      !google.accounts ||
      !google.accounts.oauth2
    ) {

      updateStatus(
        "❌ Google authentication is still loading. Please wait a few seconds and try again."
      );

      return;
    }


    const client =
      google.accounts.oauth2.initTokenClient({

        client_id: CLIENT_ID,

        scope:
          "https://www.googleapis.com/auth/gmail.readonly",

        callback: async (response) => {

          if (response.error) {

            updateStatus(
              "❌ Gmail connection failed: " + response.error
            );

            return;
          }


          gmailAccessToken =
            response.access_token;


          document.getElementById(
            "userStatus"
          ).textContent =
            "Gmail Connected";


          updateStatus(
            "✅ Gmail connected successfully! Loading messages..."
          );


          await loadGmailCounts();

        },


        error_callback: (error) => {

          updateStatus(
            "❌ Connection error: " +
            (error.type || "Unknown error")
          );

        }

      });


    client.requestAccessToken({
      prompt: "consent"
    });

  }


  document
    .getElementById("gmailButton")
    .addEventListener(
      "click",
      connectGmail
    );
</script>
